<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" class="css">
    <title>E-faigna</title>
</head>
<body>
    <article>
        <h1>E-faigna</h1>
        <div class="payments">
            <button id="or" value="orange" class="not-select">Orange Money</button>
            <button id="mv" value="mvola" class="not-select">Mvola</button>
            <button id="art" value="airtel" class="not-select">Airtel Money</button>
        </div>
    
         <span class="payby">Payment Par:</span>
    
        <div class="formulaire">
            <label for="">Nom dans le compte:</label>
            <input type="text" placeholder="Nom dans votre compte" id="nom">
    
            <label for="">Numero:</label>
            <input type="number" placeholder="Numero" id="numero">
    
            <label for="">Montant:</label>
            <input type="number" placeholder="Nom dans votre compte" id="montant">
    
            <button class="obtenir">Obtenir le lien</button>
        </div>
    
        <div class="section-lien">
            <label>Lien:</label>
            <div class="champ-lien">
                <span class="lien"></span>
            </div>
            <button id="btn-copier">Copier</button>
        </div>
    </article>
    <p id="signature">-Créer par Boutika-</p>
    <script src="script.js"></script>
</body>
</html>
